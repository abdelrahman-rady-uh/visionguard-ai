<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>VisionGuard AI — My History</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ── Page-specific additions ── */
    .history-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }

    .history-card {
      background: var(--glass);
      border: 1px solid var(--line);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-md);
      padding: 22px 24px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      transition: border-color 0.25s, box-shadow 0.25s;
      animation: fadeUp 0.4s ease-out both;
    }
    .history-card:hover {
      border-color: var(--primary);
      box-shadow: 0 6px 30px rgba(42, 212, 255, 0.1);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .history-card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 10px;
    }

    .history-filename {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--ink);
      word-break: break-all;
      flex: 1;
    }

    .history-date {
      font-size: 0.78rem;
      color: var(--muted);
      white-space: nowrap;
      margin-top: 2px;
    }

    .status-pill {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 4px 12px;
      border-radius: 50px;
      white-space: nowrap;
      flex-shrink: 0;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .status-pill.ai    { background: rgba(255,94,122,.15); color: var(--danger); border: 1px solid rgba(255,94,122,.3); }
    .status-pill.real  { background: rgba(76,255,194,.12); color: var(--primary-2); border: 1px solid rgba(76,255,194,.25); }
    .status-pill.other { background: rgba(255,178,74,.12); color: var(--accent); border: 1px solid rgba(255,178,74,.25); }

    .history-conf-track {
      background: var(--line);
      border-radius: 4px;
      height: 5px;
      position: relative;
      overflow: hidden;
    }
    .history-conf-fill {
      position: absolute;
      left: 0; top: 0; bottom: 0;
      border-radius: 4px;
      background: linear-gradient(90deg, var(--primary), var(--primary-2));
      transition: width 0.8s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .history-conf-label {
      display: flex;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--muted);
      margin-bottom: 4px;
    }

    .history-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .history-meta-chip {
      font-size: 0.75rem;
      padding: 3px 10px;
      border-radius: 6px;
      background: rgba(42,212,255,.07);
      border: 1px solid var(--line);
      color: var(--muted);
    }

    .history-caption {
      font-size: 0.83rem;
      color: var(--muted);
      line-height: 1.55;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .history-actions {
      display: flex;
      gap: 10px;
      margin-top: auto;
    }
    .btn-view {
      flex: 1;
      padding: 9px 0;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: var(--bg);
      border: none;
      border-radius: var(--radius-sm);
      font-size: 0.85rem;
      font-weight: 600;
      font-family: "Manrope", sans-serif;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.2s;
    }
    .btn-view:hover { opacity: 0.9; transform: translateY(-1px); }
    .btn-view:disabled { opacity: 0.5; cursor: wait; }

    /* ── Empty state ── */
    .empty-state {
      text-align: center;
      padding: 80px 20px;
      color: var(--muted);
    }
    .empty-state-icon { font-size: 4rem; margin-bottom: 20px; }
    .empty-state h3 { font-size: 1.3rem; color: var(--ink); margin-bottom: 10px; }
    .empty-state p  { font-size: 0.95rem; line-height: 1.6; }

    /* ── Auth guard ── */
    .auth-wall {
      text-align: center;
      padding: 100px 20px;
    }
    .auth-wall h2 { font-size: 1.5rem; color: var(--ink); margin-bottom: 14px; }
    .auth-wall p  { color: var(--muted); margin-bottom: 30px; }
    .btn-google-sm {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: #fff;
      color: #3c4043;
      padding: 12px 28px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 600;
      font-family: "Manrope", sans-serif;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(0,0,0,0.22);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .btn-google-sm:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(0,0,0,0.3); }

    /* ── Loading skeleton ── */
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 20px;
      margin-top: 24px;
    }
    .skeleton-card {
      background: var(--glass);
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      padding: 22px 24px;
      height: 200px;
      animation: pulse 1.6s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.45; }
    }

    /* ── User widget in topbar ── */
    .topbar-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .topbar-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid var(--primary);
    }
    .topbar-avatar-fallback {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--bg);
      font-size: 0.85rem;
    }
    .topbar-username {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--ink);
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
  </style>
</head>
<body class="page-dashboard">
  <div class="ambient ambient-a"></div>
  <div class="ambient ambient-c"></div>
  <canvas id="particles" class="particles"></canvas>

  <main class="shell shell-wide">
    <header class="topbar reveal-up">
      <a href="/" class="brand">
        <span class="brand-dot"></span>
        VisionGuard AI
      </a>
      <div class="nav-links" id="topbarRight">
        <a href="/upload" class="btn btn-ghost">New Analysis</a>
        <a href="/auth/logout" class="btn btn-ghost">Logout</a>
      </div>
    </header>

    <!-- Auth wall — shown if not logged in -->
    <div id="authWall" style="display:none" class="auth-wall reveal-up">
      <h2>Sign in to view your history</h2>
      <p>Your analysis history is linked to your Google account.</p>
      <button class="btn-google-sm" onclick="window.location.href='/auth/google'">
        <svg viewBox="0 0 24 24" width="18" height="18" xmlns="http://www.w3.org/2000/svg">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
        Login with Google
      </button>
    </div>

    <!-- Main content — shown when logged in -->
    <div id="historyContent" style="display:none">
      <section class="report-head reveal-up delay-1">
        <div>
          <p class="tag">Account History</p>
          <h1>My Analyses</h1>
        </div>
      </section>

      <!-- Loading skeletons -->
      <div id="loadingState" class="skeleton-grid">
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
        <div class="skeleton-card"></div>
      </div>

      <!-- Empty state -->
      <div id="emptyState" style="display:none" class="empty-state">
        <div class="empty-state-icon">📂</div>
        <h3>No analyses yet</h3>
        <p>Upload a video to run your first analysis. Results will appear here.</p>
        <a href="/upload" class="btn btn-ghost" style="margin-top:20px;display:inline-block">Start Analysis</a>
      </div>

      <!-- Results grid -->
      <div id="historyGrid" class="history-grid" style="display:none"></div>
    </div>
  </main>

  <script>
    // ── Particles background ────────────────────────────────────────────────
    (function initParticles() {
      const canvas = document.getElementById("particles");
      if (!canvas) return;
      const ctx = canvas.getContext("2d");
      const dpr = window.devicePixelRatio || 1;
      let stars = [];
      function resize() {
        canvas.width  = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
        canvas.style.width  = `${window.innerWidth}px`;
        canvas.style.height = `${window.innerHeight}px`;
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        stars = Array.from({ length: Math.max(28, Math.floor(window.innerWidth / 40)) }, () => ({
          x: Math.random() * window.innerWidth,
          y: Math.random() * window.innerHeight,
          s: 0.6 + Math.random() * 1.6,
          a: 0.2 + Math.random() * 0.5,
          t: Math.random() * Math.PI * 2,
        }));
      }
      function draw() {
        ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);
        for (const p of stars) {
          p.t += 0.02;
          const alpha = p.a + Math.sin(p.t) * 0.14;
          ctx.beginPath();
          ctx.fillStyle = `rgba(106,212,255,${Math.max(0.1, alpha)})`;
          ctx.arc(p.x, p.y, p.s, 0, Math.PI * 2);
          ctx.fill();
        }
        requestAnimationFrame(draw);
      }
      resize();
      window.addEventListener("resize", resize);
      draw();
    })();

    // ── Helpers ─────────────────────────────────────────────────────────────
    function formatDate(iso) {
      if (!iso) return "—";
      try {
        return new Date(iso).toLocaleString(undefined, {
          year: "numeric", month: "short", day: "numeric",
          hour: "2-digit", minute: "2-digit",
        });
      } catch (_) { return iso; }
    }

    function statusPillClass(status) {
      if (!status) return "other";
      const s = status.toLowerCase();
      if (s.includes("ai") || s.includes("fake") || s.includes("synthetic")) return "ai";
      if (s.includes("real") || s.includes("authentic")) return "real";
      return "other";
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    // ── Render one card ──────────────────────────────────────────────────────
    function renderCard(item, index) {
      const pillClass = statusPillClass(item.ai_status);
      const conf = Math.min(100, Math.max(0, item.confidence || 0));
      const card = document.createElement("div");
      card.className = "history-card";
      card.style.animationDelay = `${index * 0.06}s`;

      const faceChip = item.faces_detected
        ? `<span class="history-meta-chip">Faces detected</span>`
        : "";
      const tampChip = item.tampering_type && item.tampering_type !== "none"
        ? `<span class="history-meta-chip">${escapeHtml(item.tampering_type)}</span>`
        : "";

      card.innerHTML = `
        <div class="history-card-header">
          <div>
            <div class="history-filename">${escapeHtml(item.file_name || "Unknown file")}</div>
            <div class="history-date">${formatDate(item.upload_date)}</div>
          </div>
          <span class="status-pill ${pillClass}">${escapeHtml(item.ai_status || "—")}</span>
        </div>
        <div>
          <div class="history-conf-label">
            <span>Detection confidence</span>
            <span>${conf.toFixed(1)}%</span>
          </div>
          <div class="history-conf-track">
            <div class="history-conf-fill" style="width:0%" data-target="${conf}"></div>
          </div>
        </div>
        ${faceChip || tampChip ? `<div class="history-meta">${faceChip}${tampChip}</div>` : ""}
        ${item.caption ? `<div class="history-caption">${escapeHtml(item.caption)}</div>` : ""}
        <div class="history-actions">
          <button class="btn-view" data-id="${item.video_id}">View Results</button>
        </div>
      `;

      // Animate confidence bar
      requestAnimationFrame(() => {
        const fill = card.querySelector(".history-conf-fill");
        if (fill) fill.style.width = fill.dataset.target + "%";
      });

      // View Results
      card.querySelector(".btn-view").addEventListener("click", async function () {
        const btn = this;
        btn.disabled = true;
        btn.textContent = "Loading…";
        try {
          const res = await fetch(`/api/analysis-result/${item.video_id}`);
          if (!res.ok) throw new Error(await res.text());
          const data = await res.json();
          localStorage.setItem("analysisResult", JSON.stringify(data));
          window.location.href = "/dashboard";
        } catch (err) {
          btn.disabled = false;
          btn.textContent = "View Results";
          alert("Could not load result: " + err.message);
        }
      });

      return card;
    }

    // ── Main init ────────────────────────────────────────────────────────────
    async function init() {
      // Check auth
      let user = null;
      try {
        const res = await fetch("/api/me");
        const data = await res.json();
        if (data.authenticated) user = data;
      } catch (_) {}

      if (!user) {
        document.getElementById("authWall").style.display = "";
        return;
      }

      // Show topbar user
      const topbarRight = document.getElementById("topbarRight");
      const avatarEl = user.picture
        ? `<img src="${escapeHtml(user.picture)}" class="topbar-avatar" alt="${escapeHtml(user.name || "")}" onerror="this.style.display='none'">`
        : `<div class="topbar-avatar-fallback">${escapeHtml((user.name || "?")[0].toUpperCase())}</div>`;
      topbarRight.innerHTML = `
        <div class="topbar-user">
          ${avatarEl}
          <span class="topbar-username">${escapeHtml(user.name || user.email || "")}</span>
        </div>
        <a href="/upload" class="btn btn-ghost">New Analysis</a>
        <a href="/auth/logout" class="btn btn-ghost">Logout</a>
      `;

      document.getElementById("historyContent").style.display = "";

      // Load history
      try {
        const res = await fetch("/api/my-history");
        const data = await res.json();
        const history = data.history || [];

        document.getElementById("loadingState").style.display = "none";

        if (!history.length) {
          document.getElementById("emptyState").style.display = "";
          return;
        }

        const grid = document.getElementById("historyGrid");
        grid.style.display = "";
        history.forEach((item, i) => grid.appendChild(renderCard(item, i)));
      } catch (err) {
        document.getElementById("loadingState").style.display = "none";
        document.getElementById("emptyState").style.display = "";
        console.error("Failed to load history:", err);
      }
    }

    init();
  </script>
</body>
</html>
